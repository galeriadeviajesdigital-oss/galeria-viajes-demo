<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CRM | Galería de Viajes</title>

    <link rel="stylesheet" href="/crm/css/crm.css">
    <link rel="stylesheet" href="./css/crm-redesign.css">
    <link rel="stylesheet" href="/crm/css/login.css">
</head>

<body class="crm-auth-page">

    <main class="crm-auth-container">

        <section class="crm-auth-card">

            <div class="crm-auth-brand">

                <div class="crm-auth-logo">
                    <img src="/crm/logo-login.png" alt="Galería de Viajes">
                </div>

                <div>

                    <span class="crm-auth-brand-subtitle">
                        CRM
                    </span>
                </div>

            </div>


            <div class="crm-auth-header">

                <span class="crm-auth-eyebrow">
                    ÁREA PRIVADA
                </span>

                <h1>
                    Bienvenido
                </h1>

                <p>
                    Ingresa a tu cuenta para acceder
                    al sistema de gestión.
                </p>

            </div>


            <form
                id="loginForm"
                class="crm-auth-form"
            >

                <div class="crm-form-field">

                    <label for="email">
                        Correo electrónico
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        autocomplete="username"
                        placeholder="correo@galeriadeviajes.com"
                        required
                    >

                </div>


                <div class="crm-form-field">

                    <label for="password">
                        Contraseña
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        autocomplete="current-password"
                        placeholder="Ingresa tu contraseña"
                        required
                    >

                </div>


                <div
                    id="loginError"
                    class="crm-auth-message crm-auth-message-error"
                    hidden
                    role="alert"
                ></div>


                <button
                    type="submit"
                    id="loginButton"
                    class="crm-auth-button"
                >
                    Iniciar sesión
                </button>

            </form>


            <div class="crm-auth-footer">

                <a
                    href="#"
                    id="forgotPassword"
                >
                    ¿Olvidaste tu contraseña?
                </a>

            </div>

        </section>

    </main>


    <script type="module" src="/crm/js/main.js"></script>
    <script type="module" src="./js/dashboard-redesign.js"></script>

</body>
</html>
